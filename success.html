<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Success</title>

<style>
    body{
    margin:0;
    font-family:Arial,sans-serif;
    background-image:url("images/success-bg.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    text-align:center;
    width:400px;
}

h1{
    color:#28a745;
}

p{
    color:#555;
    font-size:18px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="container">
    <h1>🎉 Application Submitted!</h1>

    <p>Your application has been submitted successfully.</p>

    <button onclick="window.location.href='myapplications.html'">
        View My Applications
    </button>

    <br><br>

    <button onclick="window.location.href='jobs.html'">
        Back to Jobs
    </button>
</div>

</body>
</html>
