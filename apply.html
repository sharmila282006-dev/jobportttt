<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Job</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="apply-page" onload="checkLogin()">
    <header>
    <h1>💼 Job Portal System</h1>

    <nav>
        <a href="myapplications.html">My Applications</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>
</header>

<h2>📝 Job Application</h2>
<p id="selectedJob"></p>

<div class="login-box">

    <h2>Job Application</h2>

    <form action="apply.php" method="POST">

        <input type="hidden" id="job_title" name="job_title">

        <label>Full Name</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label>Email</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label>Phone Number</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

        <label>📄 Upload Resume</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">

        <button type="submit">Submit Application</button>

    </form>

</div>

<script>
    let job = localStorage.getItem("selectedJob");

    if (job) {
        document.getElementById("selectedJob").innerText =
            "💼 Applying for: " + job;
            document.getElementById("job_title").value = job;
    }
</script>

<footer>
    <p>© 2026 Job Portal | All Rights Reserved</p>
</footer>

</body>
</html>
